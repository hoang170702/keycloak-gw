services:

    # ==================== DATABASE ====================
    postgres:
        image: postgres:15
        container_name: keycloak_db
        restart: always
        environment:
            POSTGRES_DB: keycloak
            POSTGRES_USER: keycloak
            POSTGRES_PASSWORD: password
        volumes:
            - keycloak_db_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        networks:
            - keycloak-network

    # ==================== KEYCLOAK ====================
    keycloak:
        image: quay.io/keycloak/keycloak:24.0
        container_name: keycloak
        command: start-dev
        environment:
            KC_DB: postgres
            KC_DB_URL_HOST: postgres
            KC_DB_URL_DATABASE: keycloak
            KC_DB_USERNAME: keycloak
            KC_DB_PASSWORD: password
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
        ports:
            - "8080:8080"
        depends_on:
            - postgres
        networks:
            - keycloak-network

    # ==================== KEYCLOAK-GW APP ====================
    keycloak-gw:
        image: huyhoang11202/keycloak-gw:latest
        container_name: keycloak-gw
        restart: on-failure
        environment:
            SERVER_PORT: 9090
            KEYCLOAK_BASE_URL: http://keycloak:8080
            KEYCLOAK_MASTER_ADMIN_REALM: master
            KEYCLOAK_MASTER_ADMIN_CLIENT_ID: admin-cli
            KEYCLOAK_ECOM_ECOM_REALM: ecom
            KEYCLOAK_ECOM_ECOM_CLIENT_ID: ecom-client
            KEYCLOAK_ECOM_ECOM_CLIENT_SECRET: YN3Glh4Fw8zwcFhzoLF14ikEYSwpedLv
            SPRING_APPLICATION_NAME: keycloak-gw
        ports:
            - "9090:9090"
        depends_on:
            - keycloak
        networks:
            - keycloak-network

networks:
    keycloak-network:
        driver: bridge

volumes:
    keycloak_db_data:
